name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-checks:
    name: Linux checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace and conflict markers
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD
          elif [ "${{ github.event_name }}" = "push" ] && git rev-parse --verify "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            git diff --check "${{ github.event.before }}"...HEAD
          else
            git diff --check HEAD
          fi

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

      - name: Install Mihomo binary (Linux)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dl_dir="$RUNNER_TEMP/mihomo-dl"
          mkdir -p "$dl_dir"
          gh release download -R MetaCubeX/mihomo --pattern "mihomo-linux-amd64-compatible-v*.gz" -D "$dl_dir"
          archive="$(find "$dl_dir" -maxdepth 1 -type f -name '*.gz' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "Mihomo Linux archive not found" >&2
            exit 1
          fi
          gzip -dc "$archive" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
          rm -rf "$dl_dir"
          echo "VERVE_MIHOMO_BIN=$RUNNER_TEMP/mihomo" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/mihomo" -v

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

  windows-checks:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Install Mihomo binary (Windows)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dlDir = Join-Path $env:RUNNER_TEMP 'mihomo-dl'
          $outDir = Join-Path $env:RUNNER_TEMP 'mihomo-bin'
          New-Item -ItemType Directory -Force -Path $dlDir, $outDir | Out-Null
          gh release download -R MetaCubeX/mihomo --pattern "mihomo-windows-amd64-compatible-v*.zip" -D $dlDir
          $zip = Get-ChildItem -Path $dlDir -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Mihomo Windows archive not found' }
          Expand-Archive -Path $zip.FullName -DestinationPath $outDir -Force
          $exe = Get-ChildItem -Path $outDir -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Mihomo Windows executable not found in archive' }
          "VERVE_MIHOMO_BIN=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $exe.FullName -v

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features
